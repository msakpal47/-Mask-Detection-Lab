<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sentiment Prediction</title>
    <style>
      body { font-family: Arial, sans-serif; background:#0f172a; color:#fff; margin:0; padding:2rem; }
      .card { max-width:720px; margin:auto; background:#1e293b; padding:1.5rem; border-radius:12px; }
      input, textarea { width:100%; padding:0.75rem; border-radius:8px; border:1px solid #334155; background:#0b1220; color:#e2e8f0; }
      button { padding:0.75rem 1.25rem; background:#4f46e5; color:#fff; border:none; border-radius:8px; cursor:pointer; }
      button:hover { background:#4338ca; }
      .result { margin-top:1rem; padding:0.75rem; border-radius:8px; background:#0b1220; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Sentiment Analysis</h2>
      <form action="/predict" method="post">
        <label for="review">Enter text</label>
        <textarea id="review" name="Review" rows="6" placeholder="Type your review..."></textarea>
        <div style="margin-top:1rem;">
          <button type="submit">Predict</button>
        </div>
      </form>
      {% if prediction_text %}
        <div class="result">
          {{ prediction_text }}
        </div>
      {% endif %}
    </div>
  </body>
</html>
